name: Improve PortBridge
description: Suggest a way to make it easier for projects to share work.
title: "[Idea] "
body:
  - type: textarea
    id: workflow
    attributes:
      label: What should be easier?
      description: Describe the work you were trying to do and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Your idea
      description: Tell us what you would change and how a contributor or project would use it.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples and related discussions
      description: Add public URLs or PortBridge IDs that help explain the idea. Keep private information and game files out of the submission.
